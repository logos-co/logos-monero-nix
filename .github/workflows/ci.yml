name: CI

# Both libraries, built and then checked the ways that caught real bugs here: exact export
# counts, and a real load (dlopen plus one call), because an export check passed a library that
# could not load. Windows is cross-built on Linux and checked by import table and exports.
# The checks live in ci/ so they run the same by hand.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.os }})
    # ATTIC_TOKEN_PUBLIC only exists in the public-cache environment; main jobs must opt into
    # it to publish to the public cache.
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build both libraries
        run: nix build -L .#monerod-c .#monero-c -o result

      - name: Exports, and a real load
        run: ci/check-native.sh result result-1

  windows:
    name: x86_64-windows (cross)
    environment: ${{ github.ref == 'refs/heads/main' && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Build both DLLs
        run: nix build -L .#packages.x86_64-windows.monerod-c .#packages.x86_64-windows.monero-c -o result

      - name: Import tables and exports
        # Ubuntu's objdump reads PE; one that cannot fails the script's empty-import guard.
        run: OBJDUMP=objdump ci/check-windows.sh result result-1
